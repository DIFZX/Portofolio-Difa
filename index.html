    <script>
        (() => {
            window.history.scrollRestoration = 'manual';
            const initialUrl = new URL(window.location.href);
            if (initialUrl.hash || initialUrl.searchParams.has('section')) {
                initialUrl.hash = '';
                initialUrl.searchParams.delete('section');
                window.history.replaceState(window.history.state, '', `${initialUrl.pathname}${initialUrl.search}`);
            }
            window.scrollTo(0, 0);
        })();
    </script>
